<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Log Pre-processing Pipeline</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Universal Log Pre-processing Pipeline</h1>
            <p>Two-Tier Discovery & Execution Architecture (SIH26)</p>
        </header>

        <main>
            <!-- 1. Input Section -->
            <div class="panel input-section">
                <h2>Raw Log Input</h2>
                <div class="sample-selector">
                    <label for="sample-select">Load a sample format:</label>
                    <select id="sample-select">
                        <option value="">-- Select a sample log (or paste your own) --</option>
                        <option value='{"timestamp": "2026-09-13T10:00:00Z", "level": "error", "message": "Database connection failed", "host": "db-server-01"}'>JSON (Structured)</option>
                        <option value="2026-09-19 14:32:10.123 [main] INFO org.springframework.boot.Startup - Started Application in 2.5s">Java / Spring Boot Application</option>
                        <option value="INFO:root:Connected to database successfully">Python Standard Logger</option>
                        <option value="2026-09-19T14:32:10.123456789Z stdout F Starting web server on :8080">Kubernetes / CRI Container Log</option>
                        <option value='2026/09/19 14:32:10 [error] 1234#0: *1 open() "/favicon.ico" failed, client: 192.168.1.10'>Nginx Server Error Log</option>
                        <option value="<165>1 2026-09-19T14:32:10.003Z mymachine.example.com evntslog 1234 ID47 - An application event log entry">Modern RFC 5424 Syslog</option>
                        <option value="Oct 11 22:14:15 mymachine su: 'su root' failed for lonvick on /dev/pts/8">Syslog RFC 3164 (BSD)</option>
                        <option value="CEF:0|SecurityCompany|Firewall|1.0|100|Packet dropped|5|src=10.0.0.1 dst=10.0.0.2 spt=1234 dpt=80">CEF (ArcSight / SIEM Firewall)</option>
                        <option value='ts=2026-09-19T14:32:10.123Z level=error caller=main.go:42 msg="crash detected" err="null pointer" thread_id=9'>Logfmt / Key-Value</option>
                        <option value="2026-09-19 14:32:10.123 UTC [1234] postgres@mydb LOG: duration: 12.345 ms statement: SELECT * FROM users;">PostgreSQL Database Log</option>
                        <option value="Failed password for invalid user admin from 192.168.1.105 port 54321 ssh2">Unstructured SSH Auth Failure</option>
                        <option value='192.168.1.100 - john [19/Sep/2026:13:24:00 +0000] "GET /index.html HTTP/1.1" 200 4321 "https://google.com" "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"'>Web Access / Apache & Nginx (Combined Log)</option>
                        <option value="2026-09-13T10:15:30Z,ERROR,Connection reset by peer,app-server-02,pid=992">CSV / Delimited</option>
                        <option value="2026-09-13T10:20:00Z | CRITICAL | PaymentGateway | Transaction txn-8829 failed due to timeout after 3000ms">Custom (Pipe-Delimited)</option>
                        <option value="Connection refused from 192.168.1.5 on port 22">Generic Unstructured Network</option>
                        <option value="##[2026-09-13]<node-99>{temp:87.2C}(status=OK)">Custom Embedded Format</option>
                        <option value="2026-06-14 10:15:32 ERROR [MainThread] Connection timeout while accessing database: host=db01, user=admin">Regression (Section 5)</option>
                    </select>
                </div>
                <textarea id="log-input" placeholder="Paste your raw logs here (multiple lines supported)..."></textarea>
                <button id="process-btn">Run Pipeline</button>
            </div>

            <!-- Multi-card Output Container -->
            <div id="results-container"></div>
            
            <!-- Cache Inspector -->
            <div class="panel cache-inspector">
                <h2>Cache Inspector 
                    <button id="refresh-cache-btn" style="width: auto; padding: 0.3rem 0.8rem; margin: 0; font-size: 0.75rem; float: right;">Refresh</button>
                </h2>
                <pre id="cache-output">Cache is currently empty.</pre>
            </div>
        </main>
    </div>

    <!-- Template for a single result card -->
    <template id="result-card-template">
        <div class="panel result-card" style="margin-bottom: 2rem;">
            <!-- Summary Row -->
            <div class="summary-row" style="margin-bottom: 1.5rem;">
                <div class="stat-card mode-card">
                    <div class="stat-label">Processing Path</div>
                    <div class="stat-value val-mode">--</div>
                    <div class="llm-error-note" style="display:none; margin-top:0.5rem; font-size:0.7rem; color:var(--accent-orange); font-family:var(--font-code); line-height:1.35; word-break:break-word;"></div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Detected Signature</div>
                    <div class="stat-value val-format">--</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Latency</div>
                    <div class="stat-value val-latency">--</div>
                </div>
            </div>

            <!-- Extracted Fields Table -->
            <h3 style="font-family: var(--font-code); color: var(--accent-cyan); font-size: 0.9rem;">Extracted Fields</h3>
            <table class="fields-table" style="margin-bottom: 1.5rem;">
                <thead>
                    <tr>
                        <th>Field Name</th>
                        <th>Extracted Value</th>
                    </tr>
                </thead>
                <tbody class="fields-body"></tbody>
            </table>

            <!-- Normalized Output -->
            <h3 style="font-family: var(--font-code); color: var(--accent-cyan); font-size: 0.9rem;">Normalized Output (Common Schema)</h3>
            <pre class="log-output"></pre>
        </div>
    </template>

    <script src="/static/app.js"></script>
</body>
</html>
